name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  # No paths-ignore: ci-passed is a required check, and a check that never
  # reports blocks the merge.
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

  validate:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies (fallback on cache miss)
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          bun run lint
          bun run typecheck
          bun run format

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies (fallback on cache miss)
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  ci-passed:
    needs: [setup, validate, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # always(): without it the `if` is ANDed with success(), which is false
      # once a needed job was cancelled, and the step is skipped.
      - name: Fail when a job failed, was cancelled or was skipped
        if: always() && (needs.setup.result != 'success' || needs.validate.result != 'success' || needs.test.result != 'success')
        run: exit 1
